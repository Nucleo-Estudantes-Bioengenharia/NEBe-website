services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:8080}
    image: nebe-website
    container_name: nebe-website
    ports:
      - "${PORT:-8080}:8080"
    restart: unless-stopped
    # Endurecimento: sistema de ficheiros só de leitura e sem privilégios extra.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
